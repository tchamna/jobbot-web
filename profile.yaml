# ---------------------------------------------------------------------------
# Archetypes: the bot detects which one a job ad belongs to, then uses the
# matching headline, summary and cover-letter story.
# ---------------------------------------------------------------------------
archetypes:
  logistics:
    detect: [logistics, supply chain, warehouse, wms, tms, erp, routing, dispatch, fleet, transportation, freight, inventory, fulfillment, optimization, operations research, cold storage, cold chain, distribution, scheduling, last mile, network design]
    headline: "Applied Data Scientist | Optimization, Forecasting & Operations ML"
    summary: >-
      Applied data scientist who builds optimization and machine-learning models that run
      operations. PhD in Mechanical Engineering (optimal and model-predictive control) and
      M.S. in Physics, with 10+ years turning messy operational data into production Python
      and SQL systems: a vehicle-routing dispatch optimizer (Google OR-Tools, pickup-and-delivery
      with time windows), transit capacity models for New York agencies, and battery-fleet
      anomaly detection that cut processing time by 98%. Now doing analytics for organ-recovery
      operations, a cold chain where every decision runs against the clock.
    hook: >-
      Most of my career has come back to one question: how do you keep a physical system inside its
      limits while it is being pushed hard? I answered it with optimal controllers as a PhD control
      engineer, for grid-scale battery fleets at EOS Energy, and now for organ recovery at NJ Sharing
      Network, a cold chain where the deadline is measured in hours. {company} faces the same problem
      at warehouse scale, which is why the {title} role stands out to me.
  energy:
    detect: [energy, battery, grid, utility, power, renewable, solar, storage, forecasting load, demand response, telemetry, iot, sensor]
    headline: "Data Scientist | Energy Systems, Time Series & Anomaly Detection"
    summary: >-
      Data scientist with a PhD in Mechanical Engineering (optimal control) and 10+ years of
      building models for physical systems. At EOS Energy I built State-of-Charge models under
      3% RMSE, deterministic weak-battery detection and real-time anomaly pipelines that cut
      processing time by 98% and response time by 75%. I pair physics intuition with production
      Python, SQL and cloud deployment.
    hook: >-
      I spent three years at EOS Energy making grid-scale batteries predictable, and before that
      a decade designing optimal controllers for physical systems. {company}'s {title} role sits
      exactly where those two threads meet.
  healthcare:
    detect: [healthcare, clinical, patient, hospital, organ, transplant, ehr, epic, medical, health system, payer, claims, hipaa]
    headline: "Data Scientist | Healthcare Operations Analytics & Decision Support"
    summary: >-
      Data scientist working in organ and tissue procurement analytics at NJ Sharing Network
      (TrueNorth, DonorNet, UNOS workflows), with a PhD in Mechanical Engineering and 10+ years of
      building production ML, forecasting and optimization tools. I focus on decision support for
      time-critical operations and on dashboards that front-line coordinators actually use.
    hook: >-
      In organ recovery, a late decision can cost a life. My work at NJ Sharing Network has taught
      me to build analytics that respect that clock, and the {title} role at {company} is where I
      want to take that discipline next.
  ai_llm:
    detect: [llm, large language model, generative ai, genai, rag, retrieval, langchain, transformer, nlp, agent, agentic, prompt, embedding, vector]
    headline: "AI Engineer / Data Scientist | RAG, LLM Systems & MLOps"
    summary: >-
      AI engineer and data scientist with a PhD and 10+ years of shipping ML to production. I built
      and deployed RAG systems (FAISS, Transformers, LangChain) on Azure with CI/CD, and I founded
      Resulam, a language-technology platform that has reached more than 5 million learners
      across African languages, including low-resource NLP datasets.
    hook: >-
      I have spent the last decade teaching machines languages that most models have never seen,
      such as Nufi and other Bamileke languages, while shipping RAG systems to production on Azure.
      That combination is why the {title} role at {company} caught my attention.
  analytics:
    detect: [analytics, dashboard, kpi, business intelligence, power bi, tableau, reporting, stakeholder, insights]
    headline: "Data Scientist | Analytics, ML & Decision Support"
    summary: >-
      Data scientist with a PhD and 10+ years of turning ambiguous operational questions into
      models, pipelines and dashboards that decision makers use. My record includes a 98% cut in
      data processing time at EOS Energy, published transit-capacity analysis for New York
      agencies, and production ML APIs in Python, SQL and Azure.
    hook: >-
      I like problems where the data is messy, the stakes are real, and the answer has to be
      explained to someone who will act on it. The {title} role at {company} looks like exactly that.

